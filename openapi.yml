openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: CCE PAC as a Service API
  version: 0.4.1-discovery
  summary: Contrato canónico propuesto para Platform Management, Identity & Account Services, Payment Services, Observability
    / Troubleshooting y Event Notifications del PAC as a Service.
  description: 'Especificación OpenAPI propuesta para discovery del PAC as a Service.


    Principios del contrato:

    - PAC abstrae ReqXxx/RespXxx, XML, ACK técnico, callbacks TAPP y conectividad BCRP.

    - El contexto de Institution/Partner se deriva del `client_id` autenticado y del enrolamiento en Platform Management.

    - El consumidor NO envía identificadores de Institution, Partner o TPAP como headers autoritativos; PAC los resuelve desde
    la Application autenticada.

    - `Idempotency-Key`, `X-Request-ID`, `traceparent`, `operationId`, `paymentId` y `tappTransactionId` tienen responsabilidades
    distintas.

    - Las operaciones sensibles usan OAuth2 + JWS + timestamp anti-replay.

    - El perfil exacto de firma, timeouts, códigos y mapeos TAPP debe cerrarse con BCRP/CCE y Seguridad antes de v1.0.


    Identidad del usuario final:

    - OAuth2 Client Credentials autentica a la aplicación TPAP, no al usuario final.

    - En el modelo B2B server-to-server, el usuario se referencia mediante un identificador pseudónimo/enrolado (`customerId`/`customerReference`)
    y PAC valida su asociación con device binding, cuenta e Institution.

    - Si en el futuro la app móvil llama directamente al PAC, se deberá evaluar OIDC Authorization Code/PKCE y token de usuario.


    Cambios v0.3.0 (propuesta de Arquitectura, ver Documento de Arquitectura Preliminar §5.5):


    - Esquemas OAuth2 explícitos (TPAP y Platform Admin) y mTLS como perfil objetivo de PROD.


    - Contexto de dispositivo obligatorio y verificación de pertenencia customerId↔account en operaciones sensibles.


    - Nuevas operaciones: sesión de Device Binding por SMS, aprobación/rechazo de COLLECT, reembolsos, historial de 30 días
    y JWKS del PAC.


    - Nuevos webhooks: crédito recibido, COLLECT recibido y portabilidad de alias.


    Cambios v0.4.0 (consistencia de agrupación y ejemplos; sin cambios de contrato):


    - `x-tagGroups` pasa de tres a cinco grupos: Platform Management, Identity & Account Services, Payment Services, Observability
    / Troubleshooting y Event Notifications. Rutas, tags y operationId no cambian.


    - Descripciones de tags alineadas con sus operaciones.


    - Todos los ejemplos de petición y respuesta validan contra sus esquemas; se agregan los que faltaban.


    ### Perfil de seguridad simplificado para Discovery / Mock


    Esta versión utiliza un único esquema HTTP Bearer (`ApplicationBearerAuth`) para facilitar documentación interactiva,
    demos y ejecución con Scalar Mock. En Mock puede utilizarse un token ficticio no vacío. Los scopes originalmente definidos
    se conservan como metadata `x-required-scopes` en las operaciones cuando aplica. El perfil definitivo de CERT/PROD (por
    ejemplo OAuth2 Client Credentials, mTLS y controles criptográficos adicionales) deberá cerrarse con BCRP/CCE y Seguridad
    antes de producción.

    '
servers:
- url: http://localhost:3001
  description: Mock local - Scalar
- url: https://sandbox-api.pac.example.com
  description: Sandbox / CERT (placeholder)
- url: https://api.pac.example.com
  description: Producción (placeholder)
tags:
- name: Institutions
  description: Onboarding y ciclo de vida de la institución cliente principal del PACaaS.
- name: Partners
  description: Entidades patrocinadas por una Institution, por ejemplo wallets, fintechs o TPAPs.
- name: Applications
  description: Enrolamiento de Applications consumidoras, credenciales, llaves JWS y webhooks.
- name: Services
  description: Catálogo de capacidades PACaaS habilitables comercialmente.
- name: Service Subscriptions
  description: Planes y Services contratados por una Institution o Partner.
- name: Catálogos
  description: Participantes y llaves públicas del esquema (Common Library) y llaves de firma del PAC (JWKS).
- name: Device Binding
  description: 'Vinculación del dispositivo (1FA): sesión por SMS cifrado (método base), OTP como alternativa y registro del
    dispositivo.'
- name: Directorio y Alias
  description: Barrido de contactos, consulta, alta, actualización y portabilidad de alias (DPI).
- name: Cuentas
  description: Descubrimiento de cuentas y consulta de saldo en línea.
- name: Credenciales
  description: Setup, reset y cambio de la Clave TAPP (PIN) vía Common Library.
- name: Validaciones
  description: Resolución de beneficiario (anti-spoofing) y validación de QR EMVCo.
- name: Pagos
  description: Pagos push P2P/P2M, solicitudes de cobro (COLLECT), reversos, reembolsos e historial.
- name: Operaciones
  description: Estado técnico de operaciones para recuperación y diagnóstico; no sustituye al estado funcional del pago.
- name: Webhooks
  description: Eventos PAC → TPAP.
x-tagGroups:
- name: Platform Management
  tags:
  - Institutions
  - Partners
  - Applications
  - Services
  - Service Subscriptions
- name: Identity & Account Services
  tags:
  - Catálogos
  - Device Binding
  - Directorio y Alias
  - Cuentas
  - Credenciales
  - Validaciones
- name: Payment Services
  tags:
  - Pagos
- name: Observability / Troubleshooting
  tags:
  - Operaciones
- name: Event Notifications
  tags:
  - Webhooks
x-api-lifecycle: DISCOVERY_PROPOSAL
security:
- ApplicationBearerAuth: []
paths:
  /platform/v1/institutions:
    post:
      tags:
      - Institutions
      summary: Crear una Institution
      description: Inicia el onboarding de la institución cliente principal. Crear la Institution no habilita tráfico productivo
        automáticamente.
      operationId: createInstitution
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstitutionRequest'
            example:
              legalName: Banco Andino S.A.
              commercialName: Banco Andino
              taxId: '20100000001'
              country: PE
              institutionCode: bank-a
              tappParticipantCode: null
      responses:
        '201':
          description: Institution creada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
              example:
                institutionId: bank-a
                legalName: Banco Andino S.A.
                commercialName: Banco Andino
                status: DRAFT
                tappParticipantCode: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-scopes:
      - platform:institutions
  /platform/v1/institutions/{institutionId}:
    get:
      tags:
      - Institutions
      summary: Consultar una Institution
      operationId: getInstitution
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/InstitutionId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Detalle de la Institution.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-scopes:
      - platform:institutions
  /platform/v1/institutions/{institutionId}/partners:
    post:
      tags:
      - Partners
      summary: Registrar un Partner patrocinado
      operationId: createPartner
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/InstitutionId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerRequest'
            example:
              name: Billetera X
              partnerCode: walletx
              partnerType: WALLET
              aliasSubdomain: billeterax
              sponsorReference: null
      responses:
        '201':
          description: Partner registrado.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
              example:
                partnerId: ptr_01J9XQF1
                institutionId: bank-a
                name: Billetera X
                partnerType: WALLET
                status: DRAFT
                aliasDomain: billeterax.cce
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Registra una entidad patrocinada bajo la Institution. El Partner puede posteriormente asociar una o más
        Applications consumidoras.
      x-required-scopes:
      - platform:institutions
  /platform/v1/applications:
    post:
      tags:
      - Applications
      summary: Enrolar una aplicación cliente
      description: Crea la identidad técnica consumidora. El `client_id` resultante permite resolver Application → Partner
        → Institution sin headers organizacionales enviados por el cliente.
      operationId: createApplication
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            example:
              name: Billetera X - Backend
              environment: CERT
              institutionId: bank-a
              partnerId: ptr_01J9XQF1
              requestedScopes:
              - device:write
              - accounts:read
              - payments:create
              - payments:read
              allowedIpRanges:
              - 203.0.113.0/28
              clientCertificateSubject: CN=api.billeterax.pe,O=Billetera X SAC,C=PE
      responses:
        '201':
          description: Aplicación enrolada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
              example:
                applicationId: app_01J9XQF1
                clientId: walletx-cert-01
                name: Billetera X - Backend
                environment: CERT
                status: DRAFT
                institutionId: bank-a
                partnerId: ptr_01J9XQF1
                allowedIpRanges:
                - 203.0.113.0/28
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-scopes:
      - platform:applications
  /platform/v1/applications/{applicationId}/jws-keys:
    post:
      tags:
      - Applications
      summary: Registrar llave pública JWS
      operationId: registerJwsKey
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterJwsKeyRequest'
            example:
              kid: walletx-2026-01
              algorithm: RS256
              publicKeyPem: '-----BEGIN PUBLIC KEY-----

                ...

                -----END PUBLIC KEY-----'
              validFrom: '2026-11-03T00:00:00Z'
              validUntil: '2027-05-03T00:00:00Z'
      responses:
        '201':
          description: Llave registrada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              example:
                kid: walletx-2026-01
                status: ACTIVE
                validFrom: '2026-11-03T00:00:00Z'
                validUntil: '2027-05-03T00:00:00Z'
              schema:
                $ref: '#/components/schemas/JwsKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-scopes:
      - platform:applications
  /platform/v1/applications/{applicationId}/webhooks:
    put:
      tags:
      - Applications
      summary: Configurar webhook del TPAP
      operationId: configureWebhook
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfigRequest'
            example:
              url: https://api.billeterax.pe/pac/events
              events:
              - payment.completed
              - payment.failed
              - payment.reversed
              - payment.late-result
              - payment.received
              - collect.received
              - collect.updated
              - alias.ported-out
              signatureProfile: JWS
      responses:
        '200':
          description: Webhook configurado.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              example:
                url: https://api.billeterax.pe/pac/events
                events:
                - payment.completed
                - payment.failed
                - payment.reversed
                - payment.late-result
                - payment.received
                - collect.received
                - collect.updated
                - alias.ported-out
                signatureProfile: JWS
                signingKid: pac-2026-11
                status: ACTIVE
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-scopes:
      - platform:applications
  /platform/v1/services:
    get:
      tags:
      - Services
      summary: Listar Services PACaaS
      operationId: listServices
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Catálogo de Services disponibles.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              example:
                items:
                - code: ACCOUNT_DISCOVERY
                  name: Account Discovery
                  status: ACTIVE
                - code: PAYMENTS
                  name: Payment Initiation
                  status: ACTIVE
                - code: REVERSALS
                  name: Reversal Processing
                  status: ACTIVE
              schema:
                $ref: '#/components/schemas/ServiceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Devuelve el catálogo de capacidades PACaaS habilitables mediante una Service Subscription.
      x-required-scopes:
      - platform:services
  /platform/v1/subscriptions:
    post:
      tags:
      - Service Subscriptions
      summary: Crear una Service Subscription
      operationId: createServiceSubscription
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceSubscriptionRequest'
            example:
              planCode: PAC_STANDARD
              effectiveFrom: '2026-11-15'
              institutionId: bank-a
              partnerId: ptr_01J9XQF1
              services:
              - ACCOUNT_DISCOVERY
              - PAYMENTS
              - REVERSALS
      responses:
        '201':
          description: Service Subscription creada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSubscription'
              example:
                subscriptionId: subscr_01J9XQF1
                planCode: PAC_STANDARD
                status: ACTIVE
                institutionId: bank-a
                partnerId: ptr_01J9XQF1
                enabledServices:
                - ACCOUNT_DISCOVERY
                - PAYMENTS
                - REVERSALS
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Asocia un plan y un conjunto de Services a una Institution o, opcionalmente, a uno de sus Partners.
      x-required-scopes:
      - platform:subscriptions
  /platform/v1/subscriptions/{subscriptionId}:
    get:
      tags:
      - Service Subscriptions
      summary: Consultar una Service Subscription
      operationId: getServiceSubscription
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Detalle de la Service Subscription.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-scopes:
      - platform:subscriptions
  /api/v1/configuration/catalogs:
    get:
      tags:
      - Catálogos
      summary: Obtener catálogos iniciales y llaves públicas
      description: Fachada canónica sobre `ReqListPsp`, `ReqListAccPvd` y `ReqListKeys`.
      operationId: getInitialCatalogs
      x-origin: TAPP_DERIVED
      x-tapp-mapping:
      - ReqListPsp
      - ReqListAccPvd
      - ReqListKeys
      security:
      - ApplicationBearerAuth: []
      parameters:
      - name: clVersion
        in: query
        required: false
        schema:
          type: string
        example: 2.2-01
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Catálogos disponibles.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
              example:
                participants:
                - participantCode: 000805
                  name: PAC CCE
                  type: PSP
                  ifsc: null
                - participantCode: '500001'
                  name: Banco Ejemplo
                  type: ACCOUNT_PROVIDER
                  ifsc: BCRP01
                keys:
                - kid: '20261019'
                  usage: COMMON_LIBRARY_ENCRYPTION
                  algorithm: RSA
                  keyValue: mQENBF...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      x-required-scopes:
      - catalogs:read
  /.well-known/jwks.json:
    get:
      tags:
      - Catálogos
      summary: Llaves públicas de firma del PAC
      operationId: getPacJwks
      x-origin: PAC_PRODUCT_PROPOSAL
      security: []
      description: Permite al TPAP verificar la firma JWS de respuestas y webhooks del PAC. Cacheable; el PAC publica la llave
        nueva antes de rotar.
      responses:
        '200':
          description: JWKS vigente.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                - kty: RSA
                  kid: pac-2026-11
                  use: sig
                  alg: RS256
                  n: <módulo base64url>
                  e: AQAB
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/device-bindings/otp-requests:
    post:
      tags:
      - Device Binding
      summary: Solicitar OTP de enrolamiento
      operationId: requestDeviceBindingOtp
      x-origin: TAPP_DERIVED
      x-tapp-mapping:
      - ReqOtp
      security:
