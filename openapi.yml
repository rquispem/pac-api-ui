          $ref: '#/components/responses/NotFound'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      x-required-scopes:
      - payments:reverse
  /api/v1/payments/{paymentId}/refunds:
    post:
      tags:
      - Pagos
      summary: Emitir reembolso en línea de comercio
      operationId: createRefund
      x-origin: TAPP_DERIVED
      x-lifecycle: DRAFT_REQUIRES_BCRP_CONFIRMATION
      x-tapp-mapping:
      - Mensajería de reembolso BCRP (TBD)
      x-required-scopes:
      - payments:refund
      security:
      - ApplicationBearerAuth: []
      description: Reembolso total o parcial asociado al pago P2M original (RF-09). La suma de reembolsos no puede superar
        el monto original (422 REFUND_EXCEEDS_ORIGINAL).
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XTimestamp'
      - $ref: '#/components/parameters/XPacJws'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            example:
              money:
                amount: 20.0
                currency: PEN
              reasonCode: CUSTOMER_RETURN
              merchantReference: ORD-8891
      responses:
        '202':
          description: Reembolso aceptado.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/operations/{operationId}:
    get:
      tags:
      - Operaciones
      summary: Consultar operación técnica PAC
      description: Estado técnico controlado para recuperación/troubleshooting; no sustituye el estado funcional del pago.
      operationId: getOperation
      x-origin: PAC_PRODUCT_PROPOSAL
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Estado de operación.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
              example:
                operationId: op_01JBCF0F6YDPZEJTPJ5F7JX5XG
                type: PAYMENT_INITIATION
                status: WAITING_RESPONSE
                ackStatus: ACCEPTED
                timeliness: ON_TIME
                createdAt: '2026-11-03T15:04:58Z'
                completedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      x-required-scopes:
      - operations:read
webhooks:
  paymentStatusChanged:
    post:
      tags:
      - Webhooks
      summary: Notificar cambio de estado de pago
      description: PAC invoca la URL registrada del TPAP. El `eventId` debe tratarse idempotentemente y el mensaje se firma
        con JWS. También se usa con eventType payment.received para notificar abonos al beneficiario.
      operationId: paymentStatusChangedWebhook
      x-origin: TAPP_DERIVED_ADAPTED
      x-tapp-mapping:
      - ReqTxnConfirmation / resultado final de pago
      parameters:
      - $ref: '#/components/parameters/XTimestamp'
      - $ref: '#/components/parameters/XPacJws'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
            example:
              eventId: evt_01JBCF7K
              eventType: payment.completed
              occurredAt: '2026-10-28T15:05:02Z'
              payment:
                paymentId: pay_01JBCF0EGP5KQ8Y0BQVW5F2Q4J
                operationId: op_01JBCF0F6YDPZEJTPJ5F7JX5XG
                tappTransactionId: ABC12345678901234567890123456789012
                status: COMPLETED
                money:
                  amount: 100.0
                  currency: PEN
                rrn: '629910029381'
                settledAt: '2026-10-28T15:05:00Z'
                responseCode: '00'
                lateResponse: false
      responses:
        '200':
          description: Evento recibido.
          content:
            application/json:
              example:
                received: true
                acknowledgedAt: '2026-10-28T15:05:02Z'
        '400':
          description: Evento inválido.
        '401':
          description: Firma inválida.
        '500':
          description: Error temporal; PAC aplicará política de retry.
      security:
      - ApplicationBearerAuth: []
  collectRequestReceived:
    post:
      tags:
      - Webhooks
      summary: Notificar solicitud de cobro entrante o cambio de estado
      operationId: collectRequestWebhook
      x-origin: TAPP_DERIVED
      x-tapp-mapping:
      - ReqPay(COLLECT) entrante
      parameters:
      - $ref: '#/components/parameters/XTimestamp'
      - $ref: '#/components/parameters/XPacJws'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectWebhookEvent'
      responses:
        '200':
          description: Evento recibido.
        '400':
          description: Evento inválido.
        '401':
          description: Firma inválida.
        '500':
          description: Error temporal; PAC aplicará política de retry.
      security:
      - ApplicationBearerAuth: []
  aliasPortedOut:
    post:
      tags:
      - Webhooks
      summary: Notificar baja de alias por portabilidad
      operationId: aliasPortedOutWebhook
      x-origin: TAPP_DERIVED
      x-tapp-mapping:
      - ReqMapperConfirmation
      description: El alias migró a otra entidad; el TPAP debe desactivarlo en su app.
      parameters:
      - $ref: '#/components/parameters/XTimestamp'
      - $ref: '#/components/parameters/XPacJws'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasWebhookEvent'
      responses:
        '200':
          description: Evento recibido.
        '400':
          description: Evento inválido.
        '401':
          description: Firma inválida.
        '500':
          description: Error temporal; PAC aplicará política de retry.
      security:
      - ApplicationBearerAuth: []
components:
  securitySchemes:
    ApplicationBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Bearer que autentica a la Application consumidora en esta versión de Discovery. Para Scalar Mock
        puede utilizarse cualquier token ficticio no vacío, por ejemplo `mock-token`. PAC resuelve la identidad técnica de
        la Application y, en el diseño objetivo, su relación con Partner, Institution y Service Access. El mecanismo definitivo
        para CERT/PROD se definirá con BCRP/CCE y Seguridad.
      x-production-oauth2-client-credentials:
        tokenUrl: https://identity.pac.example.com/oauth2/token
        note: Perfil objetivo para CERT/PROD. Los scopes esperados por operación se documentan en x-required-scopes.
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: UUID por intento HTTP. PAC lo genera si falta. No es idempotencia.
      schema:
        type: string
        format: uuid
      example: 8ee17213-cbaa-4f35-bae2-7a1e4c2ed8d1
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context para observabilidad.
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave estable por intención lógica. Debe reutilizarse en retries de la misma operación.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: f950f243-41d4-44ac-b2a4-2771b1e2dd31
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Epoch Unix en milisegundos. Participa en el perfil de firma y replay protection.
      schema:
        type: integer
        format: int64
      example: 1793206800000
    XPacJws:
      name: X-PAC-JWS
      in: header
      required: true
      description: 'Detached JWS propuesto. El protected header contiene al menos `alg` y `kid`. El perfil PAC liga método,
        path, timestamp, Idempotency-Key cuando exista y hash SHA-256 del body. Canonicalización final: TBD Seguridad.'
      schema:
        type: string
      example: eyJhbGciOiJSUzI1NiIsImtpZCI6IndhbGxldC14LTIwMjYtMDEifQ..MEUCIQD...
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: ID de aplicación.
      schema:
        type: string
      example: app_01J9XQF1
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: ID de suscripción.
      schema:
        type: string
      example: subscr_01J9XQF1
    AliasId:
      name: aliasId
      in: path
      required: true
      description: ID de alias.
      schema:
        type: string
      example: alias_01J9XQF1
    AccountId:
      name: accountId
      in: path
      required: true
      description: ID canónico de cuenta.
      schema:
        type: string
      example: acc_9ad31e
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: ID funcional PAC; no es txnId TAPP.
      schema:
        type: string
      example: pay_01JBCF0EGP5KQ8Y0BQVW5F2Q4J
    OperationId:
      name: operationId
      in: path
      required: true
      description: ID técnico PAC.
      schema:
        type: string
      example: op_01JBCF0F6YDPZEJTPJ5F7JX5XG
    InstitutionId:
      name: institutionId
      in: path
      required: true
      description: ID canónico de la Institution en PACaaS; distinto al código de participante TAPP.
      schema:
        type: string
      example: bank-a
    CollectRequestId:
      name: collectRequestId
      in: path
      required: true
      schema:
        type: string
      example: col_01JBD2
    CustomerIdQuery:
      name: customerId
      in: query
      required: true
      schema:
        type: string
      example: cus_01JBCER9
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor opaco de paginación.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    XRequestId:
      description: Request ID procesado por PAC.
      schema:
        type: string
        format: uuid
    CacheControlNoStore:
      description: Respuesta no cacheable.
      schema:
        type: string
        const: no-store
  schemas:
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          multipleOf: 0.01
          example: 100.0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: PEN
    ErrorResponse:
      type: object
      required:
      - status
      - code
      - category
      - message
      - requestId
      - retryable
      properties:
        status:
          type: string
          const: ERROR
        code:
          type: string
          example: TAPP_TIMEOUT
        category:
          type: string
          enum:
          - VALIDATION
          - AUTHENTICATION
          - AUTHORIZATION
          - SECURITY
          - IDEMPOTENCY
          - BUSINESS
          - UPSTREAM
          - TIMEOUT
          - INTERNAL
          - RATE_LIMIT
        message:
          type: string
          example: No se obtuvo respuesta definitiva dentro del deadline.
        requestId:
          type: string
          format: uuid
        traceId:
          type:
          - string
          - 'null'
        retryable:
          type: boolean
          example: true
        upstreamCode:
          type:
          - string
          - 'null'
          description: Código BCRP/TAPP si es seguro exponerlo.
          example: U02
    Application:
      type: object
      required:
      - applicationId
      - clientId
      - institutionId
      - name
      - environment
      - status
      properties:
        applicationId:
          type: string
          example: app_01J9XQF1
        clientId:
          type: string
          example: wallet-x-mobile-prod
        name:
          type: string
          example: Wallet X Mobile
        environment:
          type: string
          enum:
          - SANDBOX
          - CERT
          - PROD
          example: CERT
        status:
          type: string
          enum:
          - DRAFT
          - CERTIFICATION
          - ACTIVE
          - SUSPENDED
          - REVOKED
          example: CERTIFICATION
        institutionId:
          type: string
          example: bank-a
          description: Institution propietaria/patrocinadora de la Application.
        partnerId:
          type:
          - string
          - 'null'
          example: wallet-x
          description: Partner asociado cuando la Application pertenece a una entidad patrocinada; puede ser null para Applications
            directas de la Institution.
        allowedIpRanges:
          type: array
          items:
            type: string
      description: Aplicación técnica registrada para consumir APIs PACaaS. Su clientId permite resolver el contexto de Institution/Partner.
    CreateApplicationRequest:
      type: object
      required:
      - institutionId
      - name
      - environment
      properties:
        name:
          type: string
          example: Wallet X Mobile
        environment:
          type: string
          enum:
          - SANDBOX
          - CERT
          - PROD
          example: CERT
        requestedScopes:
          type: array
          items:
            type: string
          example:
          - accounts:read
          - payments:create
          - payments:read
        institutionId:
          type: string
          example: bank-a
        partnerId:
          type:
          - string
          - 'null'
          example: wallet-x
        allowedIpRanges:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            example: 203.0.113.0/28
          description: Rangos CIDR públicos autorizados del TPAP (IP whitelisting del Anexo 3). Obligatorio para CERT/PROD.
        clientCertificateSubject:
          type:
          - string
          - 'null'
          example: CN=api.walletx.pe,O=WalletX SAC,C=PE
          description: Subject del certificado mTLS de la Application.
    RegisterJwsKeyRequest:
      type: object
      required:
      - kid
      - algorithm
      - publicKeyPem
      - validFrom
      properties:
        kid:
          type: string
          example: wallet-x-2026-01
        algorithm:
          type: string
          enum:
          - RS256
          description: RSA-SHA256 según Anexo 3. PS256 se retira hasta que Seguridad/BCRP lo aprueben.
        publicKeyPem:
          type: string
          example: '-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqh...\n-----END PUBLIC KEY-----'
          description: Llave pública RSA de 2048 bits o más, en PEM.
          maxLength: 4096
        validFrom:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
    WebhookConfigRequest:
      type: object
      required:
      - url
      - events
      properties:
        url:
          type: string
          format: uri
          example: https://api.walletx.pe/pac/events
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: &id002
            - payment.completed
            - payment.failed
            - payment.reversed
            - payment.late-result
            - payment.received
            - collect.received
            - collect.updated
            - alias.ported-out
        signatureProfile:
          type: string
          const: JWS
    CatalogResponse:
      type: object
      required:
      - participants
      - keys
      properties:
        participants:
          type: array
          items:
            type: object
            properties:
              participantCode:
                type: string
              name:
                type: string
              type:
                type: string
                enum:
                - PSP
                - ACCOUNT_PROVIDER
                - EEDE
              ifsc:
                type:
                - string
                - 'null'
        keys:
          type: array
          items:
            type: object
            properties:
              kid:
                type: string
              usage:
                type: string
              algorithm:
                type: string
              keyValue:
                type: string
    OtpRequest:
      type: object
      required:
      - customerReference
      - mobileNumber
      - purpose
      properties:
        customerReference:
          type: string
          description: Identificador pseudónimo estable del cliente en el TPAP. No debe contener DNI/teléfono en claro si
            no es necesario.
          example: cust-walletx-00123
        mobileNumber:
          type: string
          pattern: ^[0-9]{9,15}$
          example: '987654321'
        purpose:
          type: string
          enum:
          - DEVICE_BINDING
          - PIN_SETUP
          - PIN_RESET
          example: DEVICE_BINDING
          description: DEVICE_BINDING solo aplica si BCRP confirma OTP como método de amarre; el método base es SMS MO cifrado.
    OtpResponse:
      type: object
      required:
      - otpRequestId
      - expiresInSeconds
      - status
      properties:
        otpRequestId:
          type: string
          example: otp_01JBCER1G3KQ
        expiresInSeconds:
          type: integer
          example: 180
        status:
          type: string
          enum:
          - SENT
          - PENDING_VERIFICATION
          example: SENT
    DeviceBindingRequest:
      type: object
      required:
      - customerReference
      - device
      - credentialBlock
      properties:
        otpRequestId:
          type:
          - string
          - 'null'
          description: Solo si BCRP confirma el método OTP para device binding.
        otp:
          type:
          - string
          - 'null'
          writeOnly: true
        device:
          type: object
          required:
          - deviceId
          - os
          - appId
          - mobileNumber
          properties:
            deviceId:
              type: string
              example: DEV_88112
            os:
              type: string
              enum:
              - ANDROID
              - IOS
              example: ANDROID
            appId:
              type: string
              example: com.billetera.walletx
            appVersion:
              type: string
              example: 5.4.1
            deviceFingerprint:
              type: string
              example: d925f3dbcfac7f4531fc0b606cebb7950
            mobileNumber:
              type: string
              pattern: ^[0-9]{9,15}$
              example: '51912345678'
            osVersion:
              type: string
              example: '14'
            geoCode:
              type:
              - string
              - 'null'
              pattern: ^-?\d{1,2}\.\d{1,6},-?\d{1,3}\.\d{1,6}$
              example: -12.0464,-77.0428
            ipAddress:
              type: string
              example: 190.12.34.56
        credentialBlock:
          $ref: '#/components/schemas/CredentialBlock'
        customerReference:
          type: string
          description: Identificador pseudónimo estable del cliente en el TPAP. No debe contener DNI/teléfono en claro si
            no es necesario.
          example: cust-walletx-00123
        bindingSessionId:
          type:
          - string
          - 'null'
          description: Sesión de vinculación por SMS MO (método preferente, RF-01).
      oneOf:
      - required:
        - bindingSessionId
      - required:
        - otpRequestId
        - otp
    DeviceBindingResponse:
      type: object
      properties:
        bindingId:
          type: string
          example: bind_01JBCES6AJH4
        deviceId:
          type: string
          example: DEV_88112
        status:
          type: string
          enum:
          - VERIFIED
          - PENDING
          example: VERIFIED
        registeredAt:
          type: string
          format: date-time
          example: '2026-10-28T15:00:00Z'
        customerId:
          type: string
          description: Identificador PAC del cliente enrolado, utilizable en operaciones posteriores.
          example: cus_01JBCER9
    ContactSearchRequest:
      type: object
      required:
      - customerId
      - contacts
      properties:
        contacts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            pattern: ^[0-9]{9,15}$
        customerId:
          type: string
          example: cus_01JBCER9
    ContactSearchResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            type: object
            properties:
              mobileNumber:
                type: string
              present:
                type: boolean
              directoryCode:
                type:
                - string
                - 'null'
              participantCode:
                type:
                - string
                - 'null'
    AliasQueryRequest:
      type: object
      required:
      - queryType
      - alias
      properties:
        queryType:
          type: string
          enum:
          - CHECK
          - FETCH
          - PORT
          example: CHECK
        alias:
          $ref: '#/components/schemas/TappAlias'
        consent:
          type:
          - boolean
          - 'null'
          example: true
    AliasQueryResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - ACTIVE
          - INACTIVE
          - PORTABLE
          - NOT_FOUND
          example: ACTIVE
        linkedAlias:
          type:
          - string
          - 'null'
          example: 987654321@billeterax.cce
        participantCode:
          type:
          - string
          - 'null'
          example: 000805
    CreateAliasRequest:
      type: object
      required:
      - customerId
      - alias
      - accountId
      properties:
        alias:
          $ref: '#/components/schemas/TappAlias'
        mobileNumber:
          type:
          - string
          - 'null'
          example: '987654321'
        accountId:
          type: string
          example: acc_9ad31e
        previousAlias:
          type:
          - string
          - 'null'
        consent:
          type: boolean
          example: true
        isDefault:
          type: boolean
          default: false
        customerId:
          type: string
          example: cus_01JBCER9
    Alias:
      type: object
      properties:
        aliasId:
          type: string
          example: alias_01J9XQF1
        alias:
          type: string
          example: 987654321@billeterax.cce
        accountId:
          type: string
          example: acc_9ad31e
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PORTING
          example: ACTIVE
        isDefault:
          type: boolean
          example: true
    UpdateAliasRequest:
      type: object
      properties:
        isDefault:
          type: boolean
          example: true
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    AccountSearchRequest:
      type: object
      required:
      - customerId
      - participantCode
      description: El móvil se deriva del usuario/device binding verificado; no se confía en un mobileNumber enviado libremente.
      properties:
        customerId:
          type: string
          description: Cliente PAC con device binding verificado. PAC obtiene el móvil verificado desde este contexto.
          example: cus_01JBCER9
        participantCode:
          type: string
          example: '500001'
    Account:
      type: object
      properties:
        accountId:
          type: string
          example: acc_9ad31e
        maskedAccountNumber:
          type: string
          example: '******1234'
        accountType:
          type: string
          example: SAVINGS
        participantCode:
          type: string
          example: '500001'
        ifsc:
          type:
          - string
          - 'null'
          example: BCRP01
        name:
          type: string
          example: Juan Perez
        tappPinConfigured:
          type:
          - boolean
          - 'null'
          example: true
    AccountSearchResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    PinOperationRequest:
      type: object
      required:
      - customerId
      - accountId
      - credentialBlock
      - deviceContext
      properties:
        accountId:
          type: string
          example: acc_9ad31e
        otpRequestId:
          type:
          - string
          - 'null'
          example: otp_01JBCER1G3KQ
        credentialBlock:
          $ref: '#/components/schemas/CredentialBlock'
        customerId:
          type: string
          example: cus_01JBCER9
        deviceContext:
          $ref: '#/components/schemas/DeviceContext'
    CredentialOperationResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - PROCESSING
          example: SUCCESS
        operationId:
          type:
          - string
          - 'null'
          example: op_01JBCF0F6YDPZEJTPJ5F7JX5XG
    BalanceEnquiryRequest:
      type: object
      required:
      - customerId
      - credentialBlock
      - deviceContext
      properties:
        credentialBlock:
          $ref: '#/components/schemas/CredentialBlock'
        customerId:
          type: string
          example: cus_01JBCER9
        deviceContext:
          $ref: '#/components/schemas/DeviceContext'
    BalanceResponse:
      type: object
      properties:
        accountId:
          type: string
          example: acc_9ad31e
        balance:
          $ref: '#/components/schemas/Money'
        asOf:
          type: string
          format: date-time
          example: '2026-10-28T15:05:00Z'
    BeneficiaryResolveRequest:
      type: object
      required:
      - alias
      properties:
        alias:
          $ref: '#/components/schemas/TappAlias'
    BeneficiaryResolveResponse:
      type: object
      properties:
        maskedName:
          type: string
          example: J*** P****
        userType:
          type: string
          enum:
          - PERSON
          - MERCHANT
          example: PERSON
        participantCode:
          type: string
          example: '500001'
        instructionId:
          type: string
          example: INST-8829104
        resolvedAlias:
          type: string
          example: 987654321@billeterax.cce
        instructionExpiresAt:
          type: string
          format: date-time
          description: El instructionId debe usarse en createPayment antes de esta hora.
    QrResolveRequest:
      type: object
      required:
      - qrPayload
      properties:
        qrPayload:
          type: string
          minLength: 20
          maxLength: 512
          pattern: ^000201
          description: Payload EMVCo (Perú QR); inicia con el Payload Format Indicator 000201.
    QrResolveResponse:
      type: object
      properties:
        merchantName:
          type: string
          example: Bodega Don Pepe
        merchantId:
          type:
          - string
          - 'null'
          example: MERCH_001
        mcc:
          type: string
          example: '5411'
        amount:
          type:
          - number
          - 'null'
          example: 45.0
        currency:
          type:
          - string
          - 'null'
          example: PEN
        verificationToken:
          type: string
          example: TOK_QR_991
    PaymentRequest:
      type: object
      required:
      - customerId
      - paymentType
      - payerAccountId
      - payeeAlias
      - money
      - instructionId
      - credentialBlock
      - deviceContext
      properties:
        customerId:
          type: string
          example: cus_01JBCER9
        paymentType:
          type: string
          enum:
          - P2P
          - P2M
          example: P2P
        payerAccountId:
          type: string
          example: acc_9ad31e
        payerAlias:
          type:
          - string
          - 'null'
          example: 912345678@billeterax.cce
        payeeAlias:
          $ref: '#/components/schemas/TappAlias'
        money:
          $ref: '#/components/schemas/Money'
        instructionId:
          type: string
          example: INST-8829104
        credentialBlock:
          $ref: '#/components/schemas/CredentialBlock'
        remarks:
          type:
          - string
          - 'null'
          maxLength: 140
          example: Pago de cena
        qrVerificationToken:
          type:
          - string
          - 'null'
        deviceContext:
          $ref: '#/components/schemas/DeviceContext'
    Payment:
      type: object
      required:
      - paymentId
      - operationId
      - status
      - money
      properties:
        paymentId:
          type: string
          example: pay_01JBCF0EGP5KQ8Y0BQVW5F2Q4J
        operationId:
          type: string
          example: op_01JBCF0F6YDPZEJTPJ5F7JX5XG
        tappTransactionId:
          type:
          - string
          - 'null'
          minLength: 35
          maxLength: 35
          description: txnId TAPP, separado del paymentId.
          example: ABC12345678901234567890123456789012
        status:
          type: string
          enum:
          - CREATED
          - PROCESSING
          - COMPLETED
          - REJECTED
          - FAILED
          - CLIENT_TIMED_OUT
          - REVERSAL_PENDING
          - REVERSED
          example: COMPLETED
        money:
          $ref: '#/components/schemas/Money'
        rrn:
          type:
          - string
          - 'null'
          example: '629910029381'
        settledAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-10-28T15:05:00Z'
        responseCode:
          type:
          - string
          - 'null'
          example: '00'
        lateResponse:
          type: boolean
          default: false
        direction:
          type: string
          enum:
          - DEBIT
          - CREDIT
        paymentType:
          type: string
          enum:
          - P2P
          - P2M
        counterpartyAlias:
          type:
          - string
          - 'null'
        counterpartyMaskedName:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
    CollectRequest:
      type: object
      required:
      - merchantId
      - payerAlias
      - money
      - expiresInMinutes
      properties:
        merchantId:
          type: string
          example: MERCH_001
        payerAlias:
          $ref: '#/components/schemas/TappAlias'
        money:
          $ref: '#/components/schemas/Money'
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 30
        description:
          type:
          - string
          - 'null'
          example: Orden 8891
        merchantReference:
          type:
          - string
          - 'null'
          maxLength: 35
          description: Número de orden o factura del comercio.
    Collect:
      type: object
      properties:
        collectRequestId:
          type: string
          example: col_01JBCF3N
        status:
          type: string
          enum:
          - PENDING_PAYER_APPROVAL
          - APPROVED
          - DECLINED
          - EXPIRED
          - COMPLETED
          example: PENDING_PAYER_APPROVAL
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-28T15:35:00Z'
        merchantName:
          type: string
        payeeAlias:
          $ref: '#/components/schemas/TappAlias'
        money:
          $ref: '#/components/schemas/Money'
        description:
          type:
          - string
          - 'null'
        paymentId:
          type:
          - string
          - 'null'
          description: Pago generado al aprobar.
    ReversalRequest:
      type: object
      properties:
        reasonCode:
          type: string
          example: CUSTOMER_REQUEST
        reason:
          type:
          - string
          - 'null'
          example: Solicitud operativa validada
    OperationStatus:
      type: object
      properties:
        operationId:
          type: string
        type:
          type: string
          example: PAYMENT_INITIATION
        status:
          type: string
          enum:
          - CREATED
          - REQUEST_SENT
          - WAITING_RESPONSE
          - COMPLETED
          - FAILED
          - TIMEOUT
          example: WAITING_RESPONSE
        ackStatus:
          type:
          - string
          - 'null'
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - null
          example: ACCEPTED
        timeliness:
          type:
          - string
          - 'null'
          enum:
          - ON_TIME
          - LATE
          - null
          example: ON_TIME
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
    PaymentWebhookEvent:
      type: object
      required:
      - eventId
      - eventType
      - occurredAt
      - payment
      properties:
        eventId:
          type: string
          example: evt_01JBCF7K
        eventType:
          type: string
          enum:
          - payment.completed
          - payment.failed
          - payment.reversed
          - payment.late-result
          - payment.received
          example: payment.completed
        occurredAt:
          type: string
          format: date-time
        payment:
          $ref: '#/components/schemas/Payment'
    Institution:
      type: object
      required:
      - institutionId
      - legalName
      - status
      properties:
        legalName:
          type: string
          example: Banco A S.A.
        commercialName:
          type: string
          example: Banco A
        status:
          type: string
          enum:
          - DRAFT
          - CONTRACTED
          - PROVISIONING
          - CERTIFICATION
          - ACTIVE
          - SUSPENDED
          - TERMINATED
          example: PROVISIONING
        institutionId:
          type: string
          example: bank-a
          description: Identificador canónico de la Institution dentro del PACaaS; no equivale al código de participante TAPP.
        tappParticipantCode:
          type:
          - string
          - 'null'
          example: 000805
          description: Código de participante BCRP/TAPP asociado a la Institution. Es identidad de protocolo y se mantiene
            separado de institutionId.
    CreateInstitutionRequest:
      type: object
      required:
      - institutionCode
      - legalName
      properties:
        legalName:
          type: string
          example: Banco A S.A.
        commercialName:
          type: string
          example: Banco A
        taxId:
          type: string
          example: '20123456789'
        country:
          type: string
          example: PE
        institutionCode:
          type: string
          example: bank-a
          description: Código legible de la Institution dentro del producto PACaaS.
        tappParticipantCode:
          type:
          - string
          - 'null'
          example: 000805
          description: Código de participante BCRP/TAPP asociado a la Institution. Es identidad de protocolo y se mantiene
            separado de institutionId.
    Partner:
      type: object
      required:
      - partnerId
      - institutionId
      - name
      - status
      properties:
        name:
          type: string
          example: Wallet X
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - SUSPENDED
          - TERMINATED
          example: DRAFT
        partnerId:
          type: string
          example: wallet-x
          description: Identificador canónico del Partner en PACaaS.
        institutionId:
          type: string
          example: bank-a
          description: Institution patrocinadora del Partner.
        partnerType:
          type: string
          enum:
          - TPAP
          - WALLET
          - FINTECH
          - MERCHANT_AGGREGATOR
        aliasDomain:
          type: string
          readOnly: true
          example: billetera.cce
      description: Entidad patrocinada por una Institution y administrada dentro del PACaaS.
    CreatePartnerRequest:
      type: object
      required:
      - partnerCode
      - name
      - partnerType
      - aliasSubdomain
      properties:
        name:
          type: string
          example: Wallet X
        sponsorReference:
          type:
          - string
          - 'null'
          example: SPONSOR-001
        partnerCode:
          type: string
          example: wallet-x
        partnerType:
          type: string
          enum:
          - TPAP
          - WALLET
          - FINTECH
          - MERCHANT_AGGREGATOR
          example: WALLET
        aliasSubdomain:
          type: string
          pattern: ^[a-z0-9]{3,20}$
          example: billetera
          description: Subdominio asignado por el PAC (Modelo 1 de patrocinio). Los alias del Partner usan el formato <id>@<aliasSubdomain>.cce.
      description: Datos requeridos para registrar un Partner bajo una Institution.
    ServiceSubscription:
      type: object
      required:
      - subscriptionId
      - institutionId
      - planCode
      - status
      - enabledServices
      properties:
        subscriptionId:
          type: string
          example: subscr_01J9XQF1
        planCode:
          type: string
          example: PAC_STANDARD
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - SUSPENDED
          - CANCELLED
          example: ACTIVE
        institutionId:
          type: string
          example: bank-a
          description: Institution titular de la suscripción.
        partnerId:
          type:
          - string
          - 'null'
          example: wallet-x
          description: Partner beneficiario cuando la suscripción se asigna de forma específica; puede ser null.
        enabledServices:
          type: array
          items:
            type: string
          example:
          - ACCOUNT_DISCOVERY
          - PAYMENT_INITIATION
          - REVERSALS
          description: Códigos de Services efectivamente habilitados por la suscripción.
      description: Contrato lógico de acceso a Services PACaaS para una Institution o Partner.
    CreateServiceSubscriptionRequest:
      type: object
      required:
      - institutionId
      - planCode
      - services
      properties:
        planCode:
          type: string
          example: PAC_STANDARD
        effectiveFrom:
          type: string
          format: date
          example: '2026-11-01'
        institutionId:
          type: string
          example: bank-a
        partnerId:
          type:
          - string
          - 'null'
          example: wallet-x
        services:
          type: array
          items:
            type: string
          example:
          - ACCOUNT_DISCOVERY
          - PAYMENTS
          - REVERSALS
          description: Códigos de Services solicitados para la suscripción.
      description: Solicitud para contratar/habilitar un plan de Services PACaaS.
    JwsKey:
      type: object
      required:
      - kid
      - status
      properties:
        kid:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - REVOKED
          - EXPIRED
        validFrom:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
    WebhookConfig:
      type: object
      required:
      - url
      - events
      - status
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: *id002
        signatureProfile:
          type: string
          const: JWS
        signingKid:
          type: string
          description: kid de la llave del PAC publicada en /.well-known/jwks.json
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    Jwks:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
            - kty
            - kid
            - use
            - alg
            - n
            - e
            properties:
              kty:
                type: string
                const: RSA
              kid:
                type: string
              use:
                type: string
                const: sig
              alg:
                type: string
                const: RS256
              n:
                type: string
              e:
                type: string
    DeviceContext:
      type: object
      required:
      - bindingId
      - ipAddress
      description: Contexto del dispositivo amarrado (1FA). El PAC valida que el bindingId esté VERIFIED y pertenezca al customerId.
      properties:
        bindingId:
          type: string
          example: bind_01JBC9
        ipAddress:
          type: string
          example: 190.12.34.56
        geoCode:
          type:
          - string
          - 'null'
          pattern: ^-?\d{1,2}\.\d{1,6},-?\d{1,3}\.\d{1,6}$
          example: -12.0464,-77.0428
    DeviceBindingSessionRequest:
      type: object
      required:
      - customerReference
      - mobileNumber
      - deviceId
      properties:
        customerReference:
          type: string
          description: Identificador pseudónimo estable del cliente en el TPAP. No debe contener DNI/teléfono en claro si
            no es necesario.
          example: cust-walletx-00123
        mobileNumber:
          type: string
          pattern: ^[0-9]{9,15}$
        deviceId:
          type: string
    DeviceBindingSession:
      type: object
      required:
      - bindingSessionId
      - smsDestination
      - smsPayload
      - expiresInSeconds
      properties:
        bindingSessionId:
          type: string
          example: bss_01JBC8
        smsDestination:
          type: string
          description: Número largo virtual del PAC al que el SDK envía el SMS.
          example: '51900000001'
        smsPayload:
          type: string
          description: Token de un solo uso que el SDK cifra y envía por SMS desde la SIM del usuario.
        expiresInSeconds:
          type: integer
          maximum: 45
          example: 45
    CredentialBlock:
      type: object
      writeOnly: true
      required:
      - keyId
      - clVersion
      - payload
      description: Salida opaca de la Common Library, cifrada con la llave pública HSM del BCRP. El PAC no la descifra (Zero-Knowledge);
        solo la transporta.
      properties:
        keyId:
          type: string
          description: kid de la llave pública HSM BCRP (de getInitialCatalogs) usada por la CL.
          example: bcrp-hsm-2026-02
        clVersion:
          type: string
          example: 2.3.1
        payload:
          type: string
          contentEncoding: base64
          maxLength: 8192
    TappAlias:
      type: string
      pattern: ^([0-9]{9}|[a-zA-Z0-9.]{5,25})@[a-z0-9]+(\.[a-z0-9]+)*$
      maxLength: 60
      example: 912345678@billeterax.cce
      description: 'DPI: <móvil>@dominio o alias alfanumérico de 5 a 25 caracteres @dominio.'
    CollectList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Collect'
        nextCursor:
          type:
          - string
          - 'null'
    CollectApprovalRequest:
      type: object
      required:
      - customerId
      - payerAccountId
      - credentialBlock
      - deviceContext
      properties:
        customerId:
          type: string
        payerAccountId:
          type: string
        credentialBlock:
          $ref: '#/components/schemas/CredentialBlock'
        deviceContext:
          $ref: '#/components/schemas/DeviceContext'
    CollectDeclineRequest:
      type: object
      required:
      - customerId
      properties:
        customerId:
          type: string
        reasonCode:
          type:
          - string
          - 'null'
          example: USER_DECLINED
    RefundRequest:
      type: object
      required:
      - money
      - reasonCode
      properties:
        money:
          $ref: '#/components/schemas/Money'
        reasonCode:
          type: string
          example: CUSTOMER_RETURN
        merchantReference:
          type:
          - string
          - 'null'
          maxLength: 35
    Refund:
      type: object
      required:
      - refundId
      - paymentId
      - status
      - money
      properties:
        refundId:
          type: string
        paymentId:
          type: string
        operationId:
          type: string
        tappTransactionId:
          type:
          - string
          - 'null'
          minLength: 35
          maxLength: 35
        status:
          type: string
          enum:
          - PROCESSING
          - COMPLETED
          - REJECTED
          - FAILED
        money:
          $ref: '#/components/schemas/Money'
    PaymentList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        nextCursor:
          type:
          - string
          - 'null'
    CollectWebhookEvent:
      type: object
      required:
      - eventId
      - eventType
      - occurredAt
      - collect
      properties:
        eventId:
          type: string
        eventType:
          type: string
          enum:
          - collect.received
          - collect.updated
        occurredAt:
          type: string
          format: date-time
        customerId:
          type: string
        collect:
          $ref: '#/components/schemas/Collect'
    AliasWebhookEvent:
      type: object
      required:
      - eventId
      - eventType
      - occurredAt
      - aliasId
      properties:
        eventId:
          type: string
        eventType:
          type: string
          const: alias.ported-out
        occurredAt:
          type: string
          format: date-time
        aliasId:
          type: string
        customerId:
          type: string
        newParticipantCode:
          type:
          - string
          - 'null'
    ServiceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - code
            - name
            - status
            properties:
              code:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                - ACTIVE
                - BETA
                - DEPRECATED
  responses:
    BadRequest:
      description: Solicitud inválida o mal formada.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: ERROR
            code: INVALID_REQUEST
            category: VALIDATION
            message: Solicitud inválida o mal formada.
            requestId: 8ee17213-cbaa-4f35-bae2-7a1e4c2ed8d1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            retryable: false
    Unauthorized:
      description: Credenciales ausentes o token inválido.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: ERROR
            code: UNAUTHORIZED
            category: AUTHENTICATION
            message: Credenciales ausentes o token inválido.
            requestId: 8ee17213-cbaa-4f35-bae2-7a1e4c2ed8d1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            retryable: false
    Forbidden:
      description: La aplicación no tiene el entitlement/scope requerido.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: ERROR
            code: FORBIDDEN
            category: AUTHORIZATION
            message: La aplicación no tiene el entitlement/scope requerido.
            requestId: 8ee17213-cbaa-4f35-bae2-7a1e4c2ed8d1
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            retryable: false
    NotFound:
      description: Recurso no encontrado en el contexto autorizado.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: ERROR
