  /api/v1/payments:
    post:
      tags:
      - Pagos
      summary: Iniciar pago P2P/P2M
      description: 'Fachada síncrona sobre flujo asíncrono TAPP: `ReqPay → ACK técnico → RespPay`. Si el resultado llega dentro
        del deadline, retorna 200 final; si queda en curso, retorna 202 y el cliente consulta estado o recibe webhook. Un
        timeout HTTP no implica fallo de negocio. Reglas de negocio: el instructionId debe provenir de resolveBeneficiary
        vigente (anti-spoofing, RF-11); monto máximo según límite del esquema (S/ 500.00 por transacción, configurable) →
        422 LIMIT_EXCEEDED; para P2M por QR se exige qrVerificationToken.'
      operationId: createPayment
      x-origin: TAPP_DERIVED_ADAPTED
      x-tapp-mapping:
      - ReqPay(PAY)
      - Ack
      - RespPay
      security:
      - ApplicationBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XTimestamp'
      - $ref: '#/components/parameters/XPacJws'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              customerId: cus_01JBCER9
              paymentType: P2P
              payerAccountId: acc_9ad31e
              payerAlias: 912345678@billeterax.cce
              payeeAlias: 987654321@billeterax.cce
              money:
                amount: 100.0
                currency: PEN
              instructionId: INST-8829104
              credentialBlock:
                keyId: bcrp-hsm-2026-02
                clVersion: 2.3.1
                payload: <base64 cifrado por la Common Library>
              remarks: Pago de cena
              qrVerificationToken: null
              deviceContext:
                bindingId: bind_01JBCES6AJH4
                ipAddress: 190.12.34.56
                geoCode: -12.0464,-77.0428
      responses:
        '200':
          description: Resultado definitivo dentro del deadline.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                paymentId: pay_01JBCF0EGP5KQ8Y0BQVW5F2Q4J
                operationId: op_01JBCF0F6YDPZEJTPJ5F7JX5XG
                tappTransactionId: ABC12345678901234567890123456789012
                status: COMPLETED
                money:
                  amount: 100.0
                  currency: PEN
                rrn: '629910029381'
                settledAt: '2026-11-03T15:05:00Z'
                responseCode: '00'
                lateResponse: false
                direction: DEBIT
                paymentType: P2P
                counterpartyAlias: 987654321@billeterax.cce
                counterpartyMaskedName: J*** P****
                createdAt: '2026-11-03T15:04:58Z'
        '202':
          description: Aceptado; resultado definitivo pendiente.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                paymentId: pay_01JBCF0EGP5KQ8Y0BQVW5F2Q4J
                operationId: op_01JBCF0F6YDPZEJTPJ5F7JX5XG
                tappTransactionId: ABC12345678901234567890123456789012
                status: PROCESSING
                money:
                  amount: 100.0
                  currency: PEN
                rrn: null
                settledAt: null
                responseCode: null
                lateResponse: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      x-required-scopes:
      - payments:create
    get:
      tags:
      - Pagos
      summary: Historial de transacciones (últimos 30 días)
      operationId: listPayments
      x-origin: PAC_PRODUCT_PROPOSAL
      x-required-scopes:
      - payments:read
